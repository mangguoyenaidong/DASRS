services:
  mysql:
    image: mysql:8.0
    container_name: dasrs-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: security
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.0
    container_name: dasrs-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  master:
    build:
      context: ../.
      dockerfile: deploy/Dockerfile.master
    container_name: dasrs-master
    ports:
      - "50051:50051"
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=rootpassword
      - DB_NAME=security
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ../configs:/app/configs
      - ../templates:/app/templates

  agent:
    build:
      context: ../.
      dockerfile: deploy/Dockerfile.agent
    container_name: dasrs-agent
    privileged: true
    depends_on:
      master:
        condition: service_started
    environment:
      - MASTER_ADDRESS=master:50051
      - SURICATA_LOG_PATH=/var/log/suricata/eve.json
    volumes:
      - ../suricata_logs:/var/log/suricata:ro
      - ../nginx_configs:/etc/nginx/sites-available:rw

volumes:
  mysql_data:
  redis_data:

networks:
  default:
    name: dasrs-network
