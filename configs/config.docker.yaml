# DASRS Docker runtime configuration used for local screenshot/demo runs.

master:
  host: "0.0.0.0"
  grpc_port: 50051
  http_port: 8080

  database:
    host: "mysql"
    port: 3306
    username: "root"
    password: "rootpassword"
    name: "security"
    max_open_conns: 25
    max_idle_conns: 5

  redis:
    host: "redis"
    port: 6379
    password: ""
    db: 0
    pool_size: 10

  intelligence:
    repair_threshold: 80
    block_threshold: 50
    time_window: 60
    max_alerts_per_window: 10
    action_mode: "block"
    demo_mode: true
    demo_block_threshold: 40
    demo_repair_threshold: 65
    demo_exploit_bonus: 15
    whitelist:
      - "192.168.41.1"
      - "127.0.0.1"

  ai:
    enabled: false
    provider: "deepseek"
    api:
      vendor: "deepseek"
      base_url: "https://api.deepseek.com"
      api_key: ""
      model: "deepseek-chat"
      timeout_seconds: 30
    prompts:
      rule_generation_system: ""
      rule_generation_user: ""
      alert_analysis_system: ""
      alert_analysis_user: ""
    testing:
      command_template: ""
      success_match: ""

  agent_management:
    allowed_agents: []
    auto_register: true

logging:
  level: "info"
  format: "json"
