# DASRS configuration

master:
  host: "0.0.0.0"
  grpc_port: 50051
  http_port: 8080

  database:
    host: "127.0.0.1"
    port: 3307
    username: "root"
    password: "rootpassword"
    name: "security"
    max_open_conns: 25
    max_idle_conns: 5

  redis:
    host: "127.0.0.1"
    port: 6379
    password: ""
    db: 0
    pool_size: 10

  intelligence:
    repair_threshold: 80
    block_threshold: 50
    time_window: 60
    max_alerts_per_window: 10
    whitelist:
      - "192.168.41.1"
      - "127.0.0.1"

  agent_management:
    allowed_agents: []
    auto_register: true

agent:
  master_address: "master:50051"
  suricata_log_path: "/var/log/suricata/eve.json"
  agent_name: ""
  reconnect_interval: 5
  heartbeat_interval: 30

logging:
  level: "info"
  format: "json"
